<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StageXL OffscreenCanvas Worker</title>
    <style>
        html, body { margin: 0; min-height: 100%; background: #0a0d14; }
        body { display: grid; min-height: 100vh; place-items: center; }
        canvas { width: min(800px, 100vw); aspect-ratio: 8 / 5; display: block; touch-action: none; }
    </style>
</head>
<body>
    <canvas id="stage" width="800" height="500"></canvas>
    <script defer src="offscreen_canvas_main.dart.js"></script>
</body>
</html>
